services:
  db:
    image: postgres:16-alpine
    container_name: merma-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: merma
      POSTGRES_PASSWORD: merma
      POSTGRES_DB: merma
    ports:
      - "5432:5432"
    volumes:
      - merma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merma -d merma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  merma_pgdata:
