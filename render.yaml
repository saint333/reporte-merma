# Blueprint de Render para la API.
# DATABASE_URL debe apuntar a Postgres gestionado (Neon recomendado) con sslmode=require.
# CORS_ORIGINS se completa con la URL pública de Netlify, sin barra final.
services:
  - type: web
    name: merma-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/v1/salud
    # El deploy lo dispara GitHub Actions con el Deploy Hook, después de migrar Neon.
    # Si se deja en true, la API puede arrancar antes de que exista el esquema.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Opcional: si se define (mínimo 16 caracteres), la carga desde la web
      # exige la cabecera x-admin-token. Sin ella la carga queda abierta.
      - key: UPLOAD_MAX_MB
        value: "20"
      - key: APP_ENV
        value: production
      - key: TZ
        value: America/Lima
      - key: CACHE_TTL_SECONDS
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "600"
